name: Bundle Models

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. models-2025-01)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  bundle:
    name: Bundle models
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Download and package models
        shell: bash
        run: |
          set -euo pipefail

          work_dir="$(mktemp -d)"
          trap 'rm -rf "$work_dir"' EXIT
          mkdir -p dist

          download_and_package() {
            local release_tag="$1"
            local archive_name="$2"
            local source_dir="$3"
            local output_name="$4"
            local label="$5"
            local archive_path="$work_dir/$archive_name"
            local source_path="$work_dir/$source_dir"

            echo "=== Downloading $label ==="
            if ! gh release download "$release_tag" \
              --repo k2-fsa/sherpa-onnx \
              --pattern "$archive_name" \
              --dir "$work_dir" \
              --clobber; then
              curl --fail --location --retry 3 --retry-all-errors \
                --output "$archive_path" \
                "https://github.com/k2-fsa/sherpa-onnx/releases/download/$release_tag/$archive_name"
            fi

            test -s "$archive_path"
            tar --extract --file "$archive_path" --directory "$work_dir"
            test -d "$source_path"
            tar --create --gzip --file "dist/$output_name" --directory "$source_path" .
            test -s "dist/$output_name"
            echo "=== Created dist/$output_name ==="
            du -h "dist/$output_name"
          }

          download_and_package \
            "asr-models" \
            "sherpa-onnx-streaming-zipformer-zh-int8-2025-06-30.tar.bz2" \
            "sherpa-onnx-streaming-zipformer-zh-int8-2025-06-30" \
            "zipformer-zh.tar.gz" \
            "Streaming Zipformer (中文)"

          download_and_package \
            "asr-models" \
            "sherpa-onnx-streaming-paraformer-bilingual-zh-en.tar.bz2" \
            "sherpa-onnx-streaming-paraformer-bilingual-zh-en" \
            "paraformer-bilingual-zh-en.tar.gz" \
            "Streaming Paraformer (中英双语)"

          download_and_package \
            "punctuation-models" \
            "sherpa-onnx-punct-ct-transformer-zh-en-vocab272727-2024-04-12-int8.tar.bz2" \
            "sherpa-onnx-punct-ct-transformer-zh-en-vocab272727-2024-04-12-int8" \
            "punct-ct-transformer-zh-en.tar.gz" \
            "Punctuation CT-Transformer (中英)"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: "Model Bundle ${{ inputs.version }}"
          body: |
            ## 模型资源包 ${{ inputs.version }}

            各模型独立打包，按需下载解压到 `~/.config/live.captions.gtk/models/` 即可使用。

            ### 内容

            | 模型 | 文件 | 说明 |
            |------|------|------|
            | Streaming Zipformer (中文) | `zipformer-zh.tar.gz` | 以实际发布包为准 |
            | Streaming Paraformer (中英双语) | `paraformer-bilingual-zh-en.tar.gz` | 以实际发布包为准 |
            | Punctuation CT-Transformer (中英) | `punct-ct-transformer-zh-en.tar.gz` | 以实际发布包为准 |

            ### 使用方式

            ```bash
            mkdir -p ~/.config/live.captions.gtk/models/
            tar xzf zipformer-zh.tar.gz -C ~/.config/live.captions.gtk/models/
            tar xzf paraformer-bilingual-zh-en.tar.gz -C ~/.config/live.captions.gtk/models/
            tar xzf punct-ct-transformer-zh-en.tar.gz -C ~/.config/live.captions.gtk/models/
            ```
          files: |
            dist/zipformer-zh.tar.gz
            dist/paraformer-bilingual-zh-en.tar.gz
            dist/punct-ct-transformer-zh-en.tar.gz
